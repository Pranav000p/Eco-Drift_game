version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: echo-drift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echodrift
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: echodrift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: echo-drift-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: echo-drift-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://echodrift:devpassword@postgres:5432/echodrift
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
